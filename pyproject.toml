[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xrb-pipeline"
version = "0.1.0"
description = "XRB outburst detection, FRED fitting, and optical-X-ray reprocessing pipeline (MAXI + ZTF)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Samiu Bashir" }]
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "plotly",
    "requests",
    "astropy",
    "astroquery",
]

[tool.setuptools.packages.find]
where = ["src"]
